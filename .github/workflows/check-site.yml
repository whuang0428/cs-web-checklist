name: Check site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run structural checks
        run: python3 scripts/check_site.py

      - name: Run checker negative controls
        run: python3 scripts/test_check_site_negative.py

      - name: Check JavaScript syntax
        run: node --check assets/site.js
