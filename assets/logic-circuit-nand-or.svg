<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">NAND gate connected to an OR gate</title>
  <desc id="desc">Inputs A and B enter a NAND gate. Its output X and input C enter an OR gate, producing output Q.</desc>
  <style>
    .gate { fill: #ffffff; stroke: #183153; stroke-width: 5; stroke-linejoin: round; }
    .wire { fill: none; stroke: #183153; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .bubble { fill: #ffffff; stroke: #183153; stroke-width: 5; }
    .label { fill: #183153; font: 700 38px system-ui, sans-serif; }
    .caption { fill: #425466; font: 700 32px system-ui, sans-serif; }
  </style>
  <rect width="900" height="300" fill="#ffffff"/>

  <text class="label" x="35" y="97">A</text>
  <text class="label" x="35" y="177">B</text>
  <line class="wire" x1="80" y1="85" x2="250" y2="85"/>
  <line class="wire" x1="80" y1="165" x2="250" y2="165"/>

  <path class="gate" d="M250 55 H315 A70 70 0 0 1 315 195 H250 Z"/>
  <circle class="bubble" cx="397" cy="125" r="12"/>
  <path class="wire" d="M409 125 H520 V110 H584"/>
  <text class="label" x="445" y="110">X</text>
  <text class="caption" x="270" y="240">NAND</text>

  <text class="label" x="35" y="207">C</text>
  <line class="wire" x1="80" y1="190" x2="584" y2="190"/>

  <path class="gate" d="M570 70 Q610 150 570 230 Q675 230 755 150 Q675 70 570 70 Z"/>
  <line class="wire" x1="755" y1="150" x2="835" y2="150"/>
  <text class="label" x="842" y="163">Q</text>
  <text class="caption" x="637" y="275">OR</text>
</svg>
