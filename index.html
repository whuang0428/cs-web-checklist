<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CS Web Checklist</title>
  <meta name="description" content="Computer Science revision checklist for IGCSE 0478, AS 9618 and A2 9618">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to revision content</a>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'CS Web Checklist',
      repo: '',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 2,
      auto2top: true,

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search keywords...',
        noData: 'No results found.',
        depth: 4
      },

      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },

      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var main = document.querySelector('main');
            if (main) {
              main.id = 'main-content';
              main.tabIndex = -1;
            }
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'default'
    });
  </script>
</body>
</html>
