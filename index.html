<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CS Web Checklist</title>
  <meta name="description" content="Computer Science revision checklist for IGCSE 0478, AS 9618 and A2 9618">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to revision content</a>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'CS Web Checklist',
      repo: '',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 2,
      auto2top: true,

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search keywords...',
        noData: 'No results found.',
        depth: 4
      },

      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },

      plugins: [
        function (hook) {
          var mermaidFitScheduled = false;

          function fitMermaidDiagrams() {
            mermaidFitScheduled = false;
            document.querySelectorAll('.mermaid svg:not([data-content-fitted])').forEach(function (svg) {
              var graphic = svg.querySelector(':scope > g');
              if (!graphic || typeof graphic.getBBox !== 'function') return;

              var bounds;
              try {
                bounds = graphic.getBBox();
              } catch (error) {
                return;
              }

              if (!bounds.width || !bounds.height) return;

              var padding = 24;
              var fittedWidth = bounds.width + padding * 2;
              var fittedHeight = bounds.height + padding * 2;
              svg.setAttribute('viewBox', [
                bounds.x - padding,
                bounds.y - padding,
                fittedWidth,
                fittedHeight
              ].join(' '));
              svg.style.width = Math.ceil(fittedWidth) + 'px';
              svg.style.maxWidth = '100%';
              svg.style.height = 'auto';
              svg.setAttribute('data-content-fitted', 'true');
              if (svg.parentElement) {
                svg.parentElement.style.width = Math.ceil(fittedWidth + 32) + 'px';
              }
            });
          }

          function scheduleMermaidFit() {
            if (mermaidFitScheduled) return;
            mermaidFitScheduled = true;
            requestAnimationFrame(fitMermaidDiagrams);
          }

          if (!window.__mermaidFitObserver) {
            window.__mermaidFitObserver = new MutationObserver(scheduleMermaidFit);
            window.__mermaidFitObserver.observe(document.documentElement, {
              childList: true,
              subtree: true
            });
          }

          hook.doneEach(function () {
            var main = document.querySelector('main');
            if (main) {
              main.id = 'main-content';
              main.tabIndex = -1;
            }
            scheduleMermaidFit();
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'default'
    });
  </script>
</body>
</html>
